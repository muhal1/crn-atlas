name: GitHub Pages Canli Dagitim

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'veri/plan.json'
      - 'veri/dersler.json'
      - 'veri/ayarlar.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
  schedule:
    # Her gün saat 06:00 ve 15:00 UTC (TSİ 09:00 ve 18:00)
    - cron: '0 6,15 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: OBS Kontenjan ve Dersleri Guncelle
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          PYTHONUTF8: '1'
        run: |
          python panel.py dersler || echo "OBS sorgusu tamamlanamadi, mevcut veriyle devam ediliyor"

      - name: Dagitim Klasorunu Hazirla (dist)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          mkdir -p dist
          cp -r web/* dist/
          mkdir -p dist/veri
          cp -r veri/ayarlar.json veri/plan.json veri/dersler.json dist/veri/ || true
          cat > dist/config.js <<EOF
          window.DSP_CONFIG = {
            supabaseUrl: "${SUPABASE_URL}",
            supabasePublishableKey: "${SUPABASE_PUBLISHABLE_KEY}",
          };
          EOF

      - name: GitHub Pages Yapilandir
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Dagitim Paketini Yukle
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: GitHub Pages'e Dagit
        id: deployment
        uses: actions/deploy-pages@v4
